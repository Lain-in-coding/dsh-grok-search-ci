name: macOS Apple Silicon Beta Gate

on:
  workflow_dispatch:
    inputs:
      confirm_public_standard_runner:
        description: Confirm that the public-repository standard Windows and macOS Apple Silicon runners may run; this workflow does not select a paid larger runner.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Freeze the tested tarball
    if: inputs.confirm_public_standard_runner
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Pack beta candidate
        shell: pwsh
        run: |
          npm run pack:beta
          $tgz = Get-ChildItem -Path artifacts/beta-package -Recurse -Filter 'dsh-grok-search-0.1.0-beta.1.tgz' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $tgz) { throw 'Beta tarball was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tgz.FullName).Hash.ToLowerInvariant()
          if ($hash -ne '93b96673f6c6bca5ad38f7e4778d48bbe1fa0fa11b72d67a9797a6b4da0b5e84') {
            throw "Tarball hash changed: $hash"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-grok-search-beta-tarball
          path: |
            artifacts/beta-package/**/dsh-grok-search-0.1.0-beta.1.tgz
            artifacts/beta-package/**/package-receipt.json
          retention-days: 1

  macos-arm64:
    name: macOS Apple Silicon DSH Desktop gates
    needs: package
    if: inputs.confirm_public_standard_runner
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      DSH_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Prepare isolated Grok MCP and local Responses stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grok"
          mkdir -p artifacts/macos-grok-protocol
          export RUNNER_TRACKING_ID=
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$RUNNER_TEMP/grok/grok-search-rs_Darwin_universal.tar.gz" \
            "https://github.com/Episkey-G/GrokSearch-rs/releases/download/v0.1.26/grok-search-rs_Darwin_universal.tar.gz"
          echo "7d68a886e08d4fd034ac604aba79972fc4f737e016086730dbeae97b3bbd0f5a  $RUNNER_TEMP/grok/grok-search-rs_Darwin_universal.tar.gz" \
            | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/grok/grok-search-rs_Darwin_universal.tar.gz" -C "$RUNNER_TEMP/grok"
          chmod u+x "$RUNNER_TEMP/grok/grok-search-rs"
          lipo -archs "$RUNNER_TEMP/grok/grok-search-rs" | grep -q arm64
          "$RUNNER_TEMP/grok/grok-search-rs" --version
          node scripts/macos-grok-responses-stub.mjs "$RUNNER_TEMP/grok/stub.json" \
            "$RUNNER_TEMP/grok/stub-receipt.json" \
            >"$RUNNER_TEMP/grok/stub.stdout.log" 2>"$RUNNER_TEMP/grok/stub.stderr.log" &
          echo "$!" > "$RUNNER_TEMP/grok/stub.pid"
          for attempt in $(seq 1 100); do
            test -s "$RUNNER_TEMP/grok/stub.json" && break
            kill -0 "$(cat "$RUNNER_TEMP/grok/stub.pid")"
            sleep 0.1
          done
          test -s "$RUNNER_TEMP/grok/stub.json"
          node --input-type=module - "$RUNNER_TEMP/grok/stub.json" "$RUNNER_TEMP/grok/config.toml" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const ready = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const config = [
            `grok_api_url = "${ready.baseUrl}"`,
            `grok_api_key = "${ready.syntheticKey}"`,
            'grok_model = "grok-4-1-fast-reasoning"',
            'web_search_enabled = true',
            '',
          ].join('\n');
          writeFileSync(process.argv[3], config, { flag: 'wx', mode: 0o600 });
          NODE
          node --input-type=module - "$RUNNER_TEMP/grok" <<'NODE'
          import { runGrokProtocolProbe } from './scripts/b3-cli-web.mjs';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.argv[2];
          const home = join(root, 'home');
          mkdirSync(home, { recursive: true });
          const receipt = await runGrokProtocolProbe({
            executable: join(root, 'grok-search-rs'),
            configPath: join(root, 'config.toml'),
            home, tempDirectory: root, workspace: root,
          });
          writeFileSync('artifacts/macos-grok-protocol/receipt.json', JSON.stringify(receipt, null, 2) + '\n', { flag: 'wx' });
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: dsh-grok-search-beta-tarball
          path: ${{ runner.temp }}/beta
      - name: Download and verify official macOS builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-rc2" "$RUNNER_TEMP/dsh-rc3"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$RUNNER_TEMP/rc2.zip" \
            "https://download.deepseek.com/dsh-desk/bin/mac-arm64/deepseek-harness-0.2.1-rc.2-mac-arm64.zip"
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$RUNNER_TEMP/rc3.zip" \
            "https://download.deepseek.com/dsh-desk/bin/mac-arm64/deepseek-harness-0.2.1-rc.3-mac-arm64.zip"
          test "$(openssl dgst -sha512 -binary "$RUNNER_TEMP/rc2.zip" | openssl base64 -A)" = "vgGV720lZGEd2MnjVFOvhLVafwQH3iUDindQwwSjQ7AJaeZuu6UvjR2Msae2dkGS1SeMxxYCBu5Ks13n+K9Ydw=="
          test "$(openssl dgst -sha512 -binary "$RUNNER_TEMP/rc3.zip" | openssl base64 -A)" = "0tCeP/zLGLtsH+S4BD4TIyRJ8TwRhh7xaJprTMOUoEfj7hYJFC3G5l6nl/2zCTS41MeE9k+KRN19RE9sqX6goQ=="
          ditto -x -k "$RUNNER_TEMP/rc2.zip" "$RUNNER_TEMP/dsh-rc2"
          ditto -x -k "$RUNNER_TEMP/rc3.zip" "$RUNNER_TEMP/dsh-rc3"
          test -x "$RUNNER_TEMP/dsh-rc2/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness"
          test -x "$RUNNER_TEMP/dsh-rc3/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness"
      - name: Run isolated product install gate
        shell: bash
        run: |
          set -euo pipefail
          export DSH_B2_TARGET_VERSIONS=0.2.1-rc.2,0.2.1-rc.3
          TARBALL="$(find "$RUNNER_TEMP/beta" -name 'dsh-grok-search-0.1.0-beta.1.tgz' -print -quit)"
          test -n "$TARBALL"
          node scripts/b2-product-install.mjs \
            --desktop-rc2 "$RUNNER_TEMP/dsh-rc2/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --desktop-rc21 "$RUNNER_TEMP/dsh-rc3/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --product-package "$TARBALL"
      - name: Run product Desktop control gate
        shell: bash
        run: |
          set -euo pipefail
          export DSH_B2_TARGET_VERSIONS=0.2.1-rc.2,0.2.1-rc.3
          node scripts/b2-control-desktop.mjs \
            --desktop-rc2 "$RUNNER_TEMP/dsh-rc2/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --desktop-rc21 "$RUNNER_TEMP/dsh-rc3/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --case product
      - name: Run M0-04 Desktop gate
        shell: bash
        run: |
          set -euo pipefail
          export DSH_B2_TARGET_VERSIONS=0.2.1-rc.2,0.2.1-rc.3
          node scripts/b2-control-desktop.mjs \
            --desktop-rc2 "$RUNNER_TEMP/dsh-rc2/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --desktop-rc21 "$RUNNER_TEMP/dsh-rc3/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --case m0-04
      - name: Run isolated internal candidate gate
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(find "$RUNNER_TEMP/beta" -name 'dsh-grok-search-0.1.0-beta.1.tgz' -print -quit)"
          node scripts/internal-candidate.mjs \
            --desktop-rc2 "$RUNNER_TEMP/dsh-rc2/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --desktop-rc21 "$RUNNER_TEMP/dsh-rc3/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --package "$TARBALL" \
            --real-grok-executable "$RUNNER_TEMP/grok/grok-search-rs" \
            --real-grok-config "$RUNNER_TEMP/grok/config.toml"
      - name: Run packaged PluginManager gate
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(find "$RUNNER_TEMP/beta" -name 'dsh-grok-search-0.1.0-beta.1.tgz' -print -quit)"
          export DSH_B2_TARGET_VERSIONS=0.2.1-rc.2,0.2.1-rc.3
          node scripts/b2-plugin-manager-desktop.mjs \
            --desktop-rc2 "$RUNNER_TEMP/dsh-rc2/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --desktop-rc21 "$RUNNER_TEMP/dsh-rc3/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" \
            --product-package "$TARBALL"
      - name: Preserve macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-beta-evidence
          path: |
            artifacts/b2-*/**/summary.json
            artifacts/internal-candidate-real/**/summary.json
            artifacts/macos-grok-protocol/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Grok Responses stub
        if: always()
        shell: bash
        run: |
          # Always attempt every fallback, even when the graceful shutdown request fails.
          set +e
          PID_FILE="$RUNNER_TEMP/grok/stub.pid"
          GRACEFUL_STATUS=0
          if test -s "$RUNNER_TEMP/grok/stub.json"; then
            node --input-type=module - "$RUNNER_TEMP/grok/stub.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const ready = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const response = await fetch(new URL('/__shutdown', ready.baseUrl), {
            method: 'POST',
            headers: { authorization: `Bearer ${ready.syntheticKey}` },
            signal: AbortSignal.timeout(5000),
          });
          if (!response.ok) throw new Error(`Local stub shutdown returned ${response.status}.`);
          NODE
            GRACEFUL_STATUS=$?
          fi
          if test -s "$PID_FILE"; then
            STUB_PID="$(cat "$PID_FILE")"
            for attempt in $(seq 1 50); do
              test -s "$RUNNER_TEMP/grok/stub-receipt.json" && break
              kill -0 "$STUB_PID" 2>/dev/null || break
              sleep 0.1
            done
            if kill -0 "$STUB_PID" 2>/dev/null; then
              kill -TERM "$STUB_PID" 2>/dev/null
              sleep 1
              kill -0 "$STUB_PID" 2>/dev/null && kill -KILL "$STUB_PID" 2>/dev/null
            fi
          fi
          if ! test -s "$RUNNER_TEMP/grok/stub-receipt.json"; then
            echo "No local Grok stub receipt was produced (graceful status: $GRACEFUL_STATUS)."
            exit 1
          fi
          node --input-type=module - "$RUNNER_TEMP/grok/stub-receipt.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const value = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (value.requestCount < 1 || value.syntheticKeyOnly !== true) {
            throw new Error('The local Grok stub did not receive an authenticated synthetic-key request.');
          }
          console.log(`Local Grok Responses requests: ${value.requestCount}`);
          NODE
      - name: Preserve final macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-beta-final-evidence
          path: |
            artifacts/b2-*/**/summary.json
            artifacts/internal-candidate-real/**/summary.json
            artifacts/macos-grok-protocol/receipt.json
            ${{ runner.temp }}/grok/stub-receipt.json
          if-no-files-found: ignore
          retention-days: 7
