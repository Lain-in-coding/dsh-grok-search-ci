<section class="route-card" id="routeCard" data-layout="wide" aria-labelledby="routeTitle">
  <div class="rc-head">
    <div class="rc-title">
      <h3 id="routeTitle" tabindex="-1">搜索路由</h3>
      <span class="pill" id="statusPill" data-s="load"><i class="pill-dot" aria-hidden="true"></i><span id="statusText">读取配置…</span></span>
    </div>
    <div class="rc-actions">
      <div class="strip-slot" id="stripSlot"><div><div class="strip" id="strip" role="group" aria-label="搜索顺序与最近验证状态"></div></div></div>
      <button type="button" class="btn" id="testBtn"></button>
      <div class="popover" id="testPop" role="dialog" aria-modal="false" aria-labelledby="testPopTitle" hidden>
        <p class="pop-title" id="testPopTitle">测试全部已开启的搜索来源？</p>
        <p class="pop-text">会逐一测试已开启的搜索来源及其 Key，各次测试会消耗相应额度。</p>
        <div class="pop-actions">
          <button type="button" class="btn btn-ghost btn-sm" data-pop="cancel">取消</button>
          <button type="button" class="btn btn-primary btn-sm" data-pop="go">开始测试</button>
        </div>
      </div>
    </div>
      <div class="history-bar" id="historyBar" hidden>
        <span class="history-label" id="historyLabel"></span>
        <span class="history-phase" id="historyPhase" aria-hidden="true"></span>
        <div class="history-actions">
          <button type="button" class="replay-control" id="historyStop">停止</button>
          <button type="button" class="replay-control history-return" id="historyReturn">返回该条日志</button>
          <button type="button" class="replay-control history-dismiss" id="historyDismiss" aria-label="关闭回放提示" hidden></button>
        </div>
      </div>
  </div>
    <div class="history-context" id="historyContext" hidden>
      <span class="history-query" id="historyQuery"></span>
      <div class="lroute history-route" id="historyRoute" role="img" aria-label="这条历史记录的完整结果链路" title="最终结果路径，不表示上游网络请求的先后顺序。"></div>
    </div>
  <div class="banner-slot" id="bannerSlot"></div>
  <div class="stage" id="stage" data-layout="wide" role="group" aria-label="搜索路由图">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="col-agent" id="colAgent">
      <div class="node node-dsh" id="nodeDsh" title="宿主：DeepSeek Harness 的 web_search 工具">
        <span class="port" data-port="dsh-out"></span>
        <span class="port" data-port="dsh-alt"></span>
        <img class="node-logo" data-logo="dsh" alt="">
        <span class="node-name">DeepSeek Harness</span>
        <span class="node-meta">web_search</span>
      </div>
      <div class="node node-official" id="nodeOfficial" aria-hidden="true">
        <span class="port" data-port="off-in"></span>
        <img class="node-logo" data-logo="deepseek" alt="">
        <span class="off-text">
          <span class="node-name">DeepSeek 官方搜索</span>
          <span class="node-meta">内置 · 已恢复</span>
        </span>
      </div>
    </div>
    <div class="col-hub">
      <button type="button" class="node node-hub" id="nodeHub" aria-label="Grok Search Rs 设置">
        <span class="port" data-port="hub-in"></span>
        <span class="port" data-port="hub-out"></span>
        <span class="hub-glyph" id="hubGlyph" aria-hidden="true"></span>
        <span class="hub-text">
          <span class="node-name">Grok Search Rs</span>
          <span class="node-meta" id="hubMeta">准备中…</span>
        </span>
        <span class="hub-pill" id="hubPill"><span id="hubPillText">按顺序</span><span aria-hidden="true">›</span></span>
      </button>
    </div>
    <div class="col-list" id="colList">
      <div class="rgroup" data-group="primary">
        <div class="rg-label">主搜索</div>
        <div class="rg-rows" id="rowsPrimary"></div>
      </div>
      <div class="rgroup" data-group="supp">
        <div class="rg-label">补充来源 <span class="rg-hint">拖动排序</span></div>
        <div class="rg-rows" id="rowsSupp"></div>
      </div>
      <div class="rgroup" data-group="extract">
        <div class="rg-label">专用抽取</div>
        <div class="rg-rows" id="rowsExtract"></div>
      </div>
    </div>
  </div>
    <div class="history-stage" id="historyStage" role="group" aria-label="历史搜索结果链路" hidden></div>
    <p class="history-note" id="historyNote" hidden>历史结果路径 · 动效不代表原始请求时序</p>

  <footer class="rc-foot">
    <span class="cf-label">配置文件</span>
    <code class="cf-path" id="cfgPath"></code>
    <span class="tag" id="cfgTag"></span>
    <span class="cf-spacer"></span>
    <button type="button" class="btn btn-ghost btn-sm" data-open="file">打开文件</button>
    <button type="button" class="btn btn-ghost btn-sm" data-open="folder">打开文件夹</button>
  </footer>
</section>

  <section class="log-card" id="logCard" data-region="插件提供的界面" aria-labelledby="logTitle">
    <div class="lc-head">
      <div class="lc-title">
        <h3 id="logTitle">最近搜索 <span class="lc-count" id="logCount">0</span></h3>
        <p class="lc-sub">点击记录查看查询与消耗</p>
      </div>
      <div class="lc-actions">
        <div class="lc-filters" role="radiogroup" aria-label="筛选搜索记录">
          <span class="lc-filter-active" id="logFilterActive" aria-hidden="true"></span>
          <button type="button" role="radio" data-logfilter="all" aria-checked="true" tabindex="0">全部</button>
          <button type="button" role="radio" data-logfilter="ok" aria-checked="false" tabindex="-1">成功</button>
          <button type="button" role="radio" data-logfilter="fallback" aria-checked="false" tabindex="-1">回退</button>
          <button type="button" role="radio" data-logfilter="failed" aria-checked="false" tabindex="-1">失败</button>
        </div>
        <button type="button" class="lc-privacy" id="logPrivacy" aria-pressed="false" aria-label="隐藏搜索内容" title="隐藏搜索内容"></button>
      </div>
    </div>
    <div class="log-list" id="logList" role="list" aria-label="最近搜索与路由事件"></div>
    <footer class="lc-foot">
      <span id="logNote">仅内存 · 最近 20 条 · 停用或退出 DSH 后清空</span>
      <button type="button" class="btn btn-ghost btn-sm" id="logClear">清空记录</button>
    </footer>
    <div class="sr-only" id="logAnnouncer" role="status" aria-live="polite" aria-atomic="true"></div>
  </section>

<div class="route-tooltip" id="logTooltip" role="tooltip" hidden></div>
